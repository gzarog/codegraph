name: Create release

# Run from the Actions tab with a version: writes it into Cargo.toml and
# Cargo.lock, commits that to a release/vX.Y.Z branch, tags it and publishes
# the release the install scripts and `codegraph upgrade` download, then opens
# a pull request to bring the bump into main (main only takes pull requests).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.2.0 (no leading v)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: create-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      branch: ${{ steps.tag.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::'$VERSION' is not a version like 1.2.3"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi
      - name: Bump the workspace version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i "/^\[workspace.package\]/,/^\[/ s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace
          grep -q "^version = \"$VERSION\"" Cargo.toml || { echo "::error::could not set the version in Cargo.toml"; exit 1; }
      - name: Commit, tag and push
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bumped=false
          if ! git diff --quiet; then
            git commit -am "Release v$VERSION"
            bumped=true
          fi
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          # The release only needs the tag; the branch carries the bump to main.
          if $bumped; then
            if git push --force origin "HEAD:refs/heads/release/v$VERSION"; then
              echo "branch=release/v$VERSION" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Could not push release/v$VERSION; bump Cargo.toml to $VERSION on main in a pull request."
            fi
          fi

  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  pull-request:
    needs: [tag, release]
    if: needs.tag.outputs.branch != ''
    runs-on: ubuntu-latest
    steps:
      - name: Open the version-bump pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
          BRANCH: ${{ needs.tag.outputs.branch }}
        run: |
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "Release $TAG" \
            --body "Brings the $TAG version bump (Cargo.toml, Cargo.lock) into main. The release is already published." \
            || echo "::warning::Could not open the pull request (allow it under Settings > Actions > General). Open it by hand: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
