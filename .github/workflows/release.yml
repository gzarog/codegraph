name: Release

# Pushing a vX.Y.Z tag builds the binaries `codegraph upgrade` and the
# install scripts download: codegraph-<os>-<arch>.tar.gz (.zip on Windows)
# plus SHA256SUMS. The "Create release" workflow calls this one with the tag
# it just pushed, since a tag pushed by a workflow doesn't trigger others.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, asset: codegraph-linux-x86_64 }
          - { runner: ubuntu-24.04-arm, asset: codegraph-linux-aarch64 }
          - { runner: macos-15-intel, asset: codegraph-macos-x86_64 }
          - { runner: macos-14, asset: codegraph-macos-aarch64 }
          - { runner: windows-latest, asset: codegraph-windows-x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --release --locked -p codegraph
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C target/release codegraph
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/codegraph.exe -DestinationPath "dist/${{ matrix.asset }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum codegraph-* > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --generate-notes
