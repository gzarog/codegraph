[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/gzarog/codegraph"

[workspace.dependencies]
codegraph-core = { path = "crates/codegraph-core" }
codegraph-extract = { path = "crates/codegraph-extract" }
codegraph-store = { path = "crates/codegraph-store" }
codegraph-index = { path = "crates/codegraph-index" }
codegraph-resolve = { path = "crates/codegraph-resolve" }
codegraph-graph = { path = "crates/codegraph-graph" }
codegraph-context = { path = "crates/codegraph-context" }
codegraph-frameworks = { path = "crates/codegraph-frameworks" }
codegraph-telemetry = { path = "crates/codegraph-telemetry" }
codegraph-http = { path = "crates/codegraph-http" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rayon = "1"
sha2 = "0.10"
regex = "1"
globset = "0.4"
notify = "8"
tree-sitter = "0.25"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# The viewer ships inside the binary: optimize it for size.
[profile.release.package.codegraph-viewer]
opt-level = "s"
